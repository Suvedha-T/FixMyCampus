
services:

  # ==================================
  # POSTGRESQL DATABASE
  # ==================================
  postgres:
    image: postgres:16
    container_name: fixmycampus-postgres-compose
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: fixmycampus123
      POSTGRES_DB: fixmycampus
    ports:
      - "5434:5432"
    volumes:
      - fixmycampus-compose-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fixmycampus"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ==================================
  # BACKEND
  # ==================================
  backend:
    build: ./backend
    container_name: fixmycampus-backend-compose
    ports:
      - "5001:5000"
    environment:
      PORT: 5000
      JWT_SECRET: fixmycampus_super_secret_jwt_key_2026
      DATABASE_URL: postgres://postgres:fixmycampus123@postgres:5432/fixmycampus
      DB_SSL: "false"
    depends_on:
      postgres:
        condition: service_healthy

  # ==================================
  # FRONTEND
  # ==================================
  frontend:
    build: ./frontend
    container_name: fixmycampus-frontend-compose
    ports:
      - "3000:80"
    depends_on:
      - backend

  # ==================================
  # PROMETHEUS
  # ==================================
  prometheus:
    image: prom/prometheus:latest
    container_name: fixmycampus-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    depends_on:
      - backend
      - cadvisor
      - postgres-exporter

  # ==================================
  # GRAFANA
  # ==================================
  grafana:
    image: grafana/grafana:latest
    container_name: fixmycampus-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  # ==================================
  # CADVISOR
  # ==================================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: fixmycampus-cadvisor
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro

  # ==================================
  # POSTGRES EXPORTER
  # ==================================
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: fixmycampus-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:fixmycampus123@postgres:5432/fixmycampus?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      postgres:
        condition: service_healthy

# ==================================
# PERSISTENT VOLUMES
# ==================================
volumes:
  fixmycampus-compose-data:
  prometheus-data:
  grafana-data:
