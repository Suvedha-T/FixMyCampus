
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:

  # Monitor Prometheus
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  # Monitor FixMyCampus Backend
  - job_name: "fixmycampus-backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:5000"]

  # Monitor Docker containers
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  # Monitor PostgreSQL
  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]
